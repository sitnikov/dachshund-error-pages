<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>400</title>
<style>
  :root {
    --ground: #0A0E13;
    --ground-2: #0E141B;
    --steel: #46586B;
    --steel-dim: #26323E;
    --text: #93A6B8;
    --bright: #C6D4E0;
    --signal: #C8873A;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0;
    padding: 1.5rem;
    background: var(--ground);
    color: var(--text);
    font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas,
                 "Liberation Mono", monospace;
    display: grid;
    place-items: center;
  }
  .plate {
    width: min(100%, 24rem);
    padding: 1.5rem 1.75rem 2rem;
    text-align: center;
    background: var(--ground-2);
    border: 1px solid var(--steel-dim);
  }
  svg { display: block; width: 100%; height: auto; }
  .code {
    margin: 1.1rem 0 0;
    font-size: 2.2rem;
    font-weight: 300;
    line-height: 1;
    letter-spacing: 0.22em;
    color: var(--signal);
  }
  h1 {
    margin: 0.8rem 0 0;
    font-size: 0.7rem;
    font-weight: 500;
    letter-spacing: 0.18em;
    text-transform: uppercase;
    color: var(--bright);
  }
  .rule { height: 1px; width: 3rem; margin: 0.9rem auto; background: var(--steel); }
  p { margin: 0; font-size: 0.8rem; line-height: 1.65; }
  .head { transform-origin: 180px 52px; animation: peer 3.2s ease-in-out infinite; }
  @keyframes peer { 0%, 50%, 100% { transform: rotate(0) } 65%, 85% { transform: rotate(7deg) } }
  .q { animation: wonder 3.2s ease-in-out infinite; }
  @keyframes wonder { 0%, 50%, 100% { opacity: 0 } 65%, 85% { opacity: 1 } }
  @media (prefers-reduced-motion: reduce) { .head { animation: none; } .q { animation: none; opacity: 0.7; } }
</style>
</head>
<body>
<div class="plate">
  <svg viewBox="0 0 280 110" role="img" aria-label="A dachshund puzzling over a crumpled, unreadable note">
    <path d="M238 100 L242 84 L256 78 L268 84 L274 96 L270 100 Z" fill="#0A0E13" stroke="#46586B"/>
    <path d="M247 92 l6 -5 l5 5 l7 -7" fill="none" stroke="#46586B" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    <text class="q" x="198" y="22" font-size="16" fill="#46586B" font-family="ui-monospace, Menlo, Consolas, monospace" font-weight="300">?</text>
    <g fill="#C8873A">
      <path d="M60 62 Q44 58 42 40" fill="none" stroke="#C8873A" stroke-width="6" stroke-linecap="round"/>
      <rect x="68" y="78" width="11" height="22" rx="3"/>
      <rect x="84" y="78" width="11" height="22" rx="3"/>
      <rect x="150" y="78" width="11" height="22" rx="3"/>
      <rect x="166" y="78" width="11" height="22" rx="3"/>
      <rect x="58" y="50" width="122" height="36" rx="18"/>
      <g class="head">
        <circle cx="190" cy="48" r="17"/>
        <rect x="196" y="44" width="36" height="14" rx="7"/>
        <circle cx="229" cy="51" r="3.5" fill="#0A0E13"/>
        <rect x="176" y="40" width="12" height="32" rx="6" fill="#8E5B24"/>
        <circle cx="195" cy="42" r="2.4" fill="#0A0E13"/>
      </g>
    </g>
    <line x1="0" y1="100.5" x2="280" y2="100.5" stroke="#26323E"/>
  </svg>
  <p class="code">400</p>
  <h1>Could not read that</h1>
  <div class="rule"></div>
  <p>The request was garbled and the console could not make sense of it.
     Check the link you followed, or go back to your control panel.</p>
</div>
</body>
</html>
