<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>410</title>
<style>
  :root {
    --ground: #0A0E13;
    --ground-2: #0E141B;
    --steel: #46586B;
    --steel-dim: #26323E;
    --text: #93A6B8;
    --bright: #C6D4E0;
    --signal: #C8873A;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0;
    padding: 1.5rem;
    background: var(--ground);
    color: var(--text);
    font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas,
                 "Liberation Mono", monospace;
    display: grid;
    place-items: center;
  }
  .plate {
    width: min(100%, 24rem);
    padding: 1.5rem 1.75rem 2rem;
    text-align: center;
    background: var(--ground-2);
    border: 1px solid var(--steel-dim);
  }
  svg { display: block; width: 100%; height: auto; }
  .code {
    margin: 1.1rem 0 0;
    font-size: 2.2rem;
    font-weight: 300;
    line-height: 1;
    letter-spacing: 0.22em;
    color: var(--signal);
  }
  h1 {
    margin: 0.8rem 0 0;
    font-size: 0.7rem;
    font-weight: 500;
    letter-spacing: 0.18em;
    text-transform: uppercase;
    color: var(--bright);
  }
  .rule { height: 1px; width: 3rem; margin: 0.9rem auto; background: var(--steel); }
  p { margin: 0; font-size: 0.8rem; line-height: 1.65; }
  /* A fade is not motion: it stays on under prefers-reduced-motion. */
  .zzz { animation: doze 4s ease-in-out infinite; }
  .zzz:nth-child(2) { animation-delay: 0.6s; }
  .zzz:nth-child(3) { animation-delay: 1.2s; }
  @keyframes doze { 0%, 100% { opacity: 0.15 } 40% { opacity: 1 } }
</style>
</head>
<body>
<div class="plate">
  <svg viewBox="0 0 280 110" role="img" aria-label="A dachshund fast asleep on the floor">
    <g fill="#46586B" font-family="ui-monospace, Menlo, Consolas, monospace" font-weight="300">
      <text class="zzz" x="212" y="66" font-size="11">z</text>
      <text class="zzz" x="223" y="52" font-size="14">z</text>
      <text class="zzz" x="236" y="36" font-size="18">z</text>
    </g>
    <g fill="#C8873A">
      <path d="M46 84 Q28 78 34 64" fill="none" stroke="#C8873A" stroke-width="6" stroke-linecap="round"/>
      <rect x="44" y="74" width="136" height="26" rx="13"/>
      <rect x="54" y="92" width="18" height="8" rx="4" fill="#8E5B24"/>
      <rect x="200" y="88" width="32" height="12" rx="6"/>
      <circle cx="190" cy="84" r="16"/>
      <rect x="176" y="72" width="12" height="26" rx="6" fill="#8E5B24"/>
      <path d="M191 80 h6" stroke="#0A0E13" stroke-width="2" stroke-linecap="round"/>
      <circle cx="229" cy="94" r="3" fill="#0A0E13"/>
    </g>
    <line x1="0" y1="100.5" x2="280" y2="100.5" stroke="#26323E"/>
  </svg>
  <p class="code">410</p>
  <h1>This link has gone stale</h1>
  <div class="rule"></div>
  <p>A console link works only for a short while after it is issued.
     Go back to your control panel and open the console again.</p>
</div>
</body>
</html>
