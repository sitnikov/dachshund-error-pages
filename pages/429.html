<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>429</title>
<style>
  :root {
    --ground: #0A0E13;
    --ground-2: #0E141B;
    --steel: #46586B;
    --steel-dim: #26323E;
    --text: #93A6B8;
    --bright: #C6D4E0;
    --signal: #C8873A;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0;
    padding: 1.5rem;
    background: var(--ground);
    color: var(--text);
    font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas,
                 "Liberation Mono", monospace;
    display: grid;
    place-items: center;
  }
  .plate {
    width: min(100%, 24rem);
    padding: 1.5rem 1.75rem 2rem;
    text-align: center;
    background: var(--ground-2);
    border: 1px solid var(--steel-dim);
  }
  svg { display: block; width: 100%; height: auto; }
  .code {
    margin: 1.1rem 0 0;
    font-size: 2.2rem;
    font-weight: 300;
    line-height: 1;
    letter-spacing: 0.22em;
    color: var(--signal);
  }
  h1 {
    margin: 0.8rem 0 0;
    font-size: 0.7rem;
    font-weight: 500;
    letter-spacing: 0.18em;
    text-transform: uppercase;
    color: var(--bright);
  }
  .rule { height: 1px; width: 3rem; margin: 0.9rem auto; background: var(--steel); }
  p { margin: 0; font-size: 0.8rem; line-height: 1.65; }
  .tongue { transform-origin: 218px 58px; animation: pant 0.45s ease-in-out infinite alternate; }
  @keyframes pant { from { transform: scaleY(0.8) } to { transform: scaleY(1.1) } }
  .ball-air { animation: drop 1.4s cubic-bezier(.4,0,1,1) infinite; }
  @keyframes drop { from { transform: translateY(-70px); opacity: 0.4 } 20% { opacity: 1 } to { transform: translateY(0) } }
  @media (prefers-reduced-motion: reduce) { .tongue, .ball-air { animation: none; } }
</style>
</head>
<body>
<div class="plate">
  <svg viewBox="0 0 280 110" role="img" aria-label="A panting dachshund surrounded by far too many balls">
    <g fill="#26323E" stroke="#46586B">
      <circle cx="22" cy="94" r="6"/>
      <circle cx="40" cy="94" r="6"/>
      <circle cx="31" cy="83" r="6"/>
      <circle cx="122" cy="94" r="6"/>
      <circle cx="248" cy="94" r="6"/>
      <circle cx="266" cy="94" r="6"/>
      <circle cx="257" cy="83" r="6"/>
      <circle class="ball-air" cx="140" cy="94" r="6" fill="#C8873A" stroke="none"/>
    </g>
    <g fill="#C8873A">
      <path d="M60 62 Q44 58 42 40" fill="none" stroke="#C8873A" stroke-width="6" stroke-linecap="round"/>
      <rect x="68" y="78" width="11" height="22" rx="3"/>
      <rect x="84" y="78" width="11" height="22" rx="3"/>
      <rect x="150" y="78" width="11" height="22" rx="3"/>
      <rect x="166" y="78" width="11" height="22" rx="3"/>
      <rect x="58" y="50" width="122" height="36" rx="18"/>
      <circle cx="190" cy="48" r="17"/>
      <rect x="196" y="44" width="36" height="14" rx="7"/>
      <ellipse class="tongue" cx="218" cy="62" rx="4" ry="7" fill="#B5553B"/>
      <circle cx="229" cy="51" r="3.5" fill="#0A0E13"/>
      <rect x="176" y="40" width="12" height="32" rx="6" fill="#8E5B24"/>
      <circle cx="195" cy="42" r="2.4" fill="#0A0E13"/>
    </g>
    <line x1="0" y1="100.5" x2="280" y2="100.5" stroke="#26323E"/>
  </svg>
  <p class="code">429</p>
  <h1>Too many, too fast</h1>
  <div class="rule"></div>
  <p>Too many requests came from your address in a short time.
     Wait a minute, then try again.</p>
</div>
</body>
</html>
